<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Records</title>
<style>
  :root{
    --bg:#0f172a; --panel:#111827; --card:#1e293b; --border:#2c3a52;
    --text:#e5e7eb; --muted:#94a3b8; --accent:#6366f1; --accent2:#22c55e;
    --danger:#ef4444; --warn:#f59e0b;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:linear-gradient(180deg,#0b1120,#0f172a 40%); color:var(--text);
    min-height:100vh; padding:32px 16px;
  }
  .wrap{max-width:960px;margin:0 auto}
  header{margin-bottom:24px}
  h1{margin:0 0 4px;font-size:1.7rem;font-weight:700;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:.95rem}
  .status{
    display:inline-flex;align-items:center;gap:6px;margin-top:10px;
    font-size:.85rem;color:var(--muted);
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .dot.ok{background:var(--accent2)}
  .dot.bad{background:var(--danger)}
  .config{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 16px;margin-bottom:20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  }
  .config label{font-size:.8rem;color:var(--muted)}
  .config input{
    flex:1;min-width:220px;background:#0b1224;border:1px solid var(--border);
    color:var(--text);padding:8px 10px;border-radius:8px;font-size:.9rem;
  }
  .grid{display:grid;grid-template-columns:1fr 1.4fr;gap:20px}
  @media (max-width:760px){.grid{grid-template-columns:1fr}}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;
  }
  .card h2{margin:0 0 14px;font-size:1.05rem}
  form{display:flex;flex-direction:column;gap:10px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:.78rem;color:var(--muted)}
  .field input{
    background:#0b1224;border:1px solid var(--border);color:var(--text);
    padding:9px 10px;border-radius:8px;font-size:.9rem;outline:none;
  }
  .field input:focus{border-color:var(--accent)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{
    cursor:pointer;border:none;border-radius:8px;padding:10px 14px;font-size:.9rem;
    font-weight:600;transition:opacity .15s;
  }
  button:hover{opacity:.88}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-warn{background:var(--warn);color:#1a1300}
  .actions{display:flex;gap:8px;margin-top:4px}
  .msg{font-size:.82rem;padding:8px 10px;border-radius:8px;margin-top:8px;display:none}
  .msg.show{display:block}
  .msg.ok{background:rgba(34,197,94,.12);color:#4ade80;border:1px solid rgba(34,197,94,.3)}
  .msg.err{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.3)}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
  .list{display:flex;flex-direction:column;gap:10px;max-height:560px;overflow-y:auto;padding-right:4px}
  .item{
    background:#0b1224;border:1px solid var(--border);border-radius:10px;padding:12px 14px;
  }
  .item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .item-name{font-weight:600;font-size:.98rem}
  .item-course{color:var(--accent);font-size:.78rem;font-weight:600}
  .item-meta{color:var(--muted);font-size:.8rem;margin-top:2px}
  .item-id{color:#556;font-size:.68rem;margin-top:6px;word-break:break-all}
  .item-actions{display:flex;gap:6px;margin-top:10px}
  .item-actions button{padding:6px 10px;font-size:.78rem}
  .empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:.9rem}
  code{background:#0b1224;padding:1px 5px;border-radius:4px;font-size:.85em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎓 Student Records</h1>
    <div class="sub">Front-end for the Node.js + Express + MongoDB CRUD API from your guide</div>
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Checking connection…</span></div>
  </header>

  <div class="config">
    <label for="baseUrl">API base URL</label>
    <input id="baseUrl" value="http://localhost:3000" />
    <button class="btn-ghost" id="reconnectBtn">Reconnect</button>
  </div>

  <div class="grid">
    <div class="card">
      <h2 id="formTitle">Add Student</h2>
      <form id="studentForm">
        <div class="field">
          <label>Name</label>
          <input id="f-name" placeholder="e.g. Anita" required />
        </div>
        <div class="row2">
          <div class="field">
            <label>Age</label>
            <input id="f-age" type="number" min="16" max="100" placeholder="20" required />
          </div>
          <div class="field">
            <label>Course</label>
            <input id="f-course" placeholder="CSE" required />
          </div>
        </div>
        <div class="field">
          <label>Email</label>
          <input id="f-email" type="email" placeholder="anita@example.com" required />
        </div>
        <div class="actions">
          <button type="submit" class="btn-primary" id="submitBtn">Create Student</button>
          <button type="button" class="btn-ghost" id="cancelEditBtn" style="display:none">Cancel</button>
        </div>
        <div class="msg" id="formMsg"></div>
      </form>
    </div>

    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0">All Students <span id="countBadge" style="color:var(--muted);font-weight:400;font-size:.8rem"></span></h2>
        <button class="btn-ghost" id="refreshBtn">Refresh</button>
      </div>
      <div class="list" id="list"><div class="empty">Loading…</div></div>
    </div>
  </div>
</div>

<script>
let API = document.getElementById('baseUrl').value.replace(/\/$/,'');
let editingId = null;

const $ = (id) => document.getElementById(id);
const statusDot = $('statusDot'), statusText = $('statusText');
const list = $('list'), countBadge = $('countBadge');
const form = $('studentForm'), formMsg = $('formMsg'), formTitle = $('formTitle');
const submitBtn = $('submitBtn'), cancelEditBtn = $('cancelEditBtn');

function setStatus(ok, text){
  statusDot.className = 'dot ' + (ok === null ? '' : ok ? 'ok' : 'bad');
  statusText.textContent = text;
}
function showMsg(text, ok){
  formMsg.textContent = text;
  formMsg.className = 'msg show ' + (ok ? 'ok' : 'err');
  setTimeout(()=> formMsg.classList.remove('show'), 4000);
}

async function checkHealth(){
  try{
    const res = await fetch(API + '/');
    if(res.ok){ setStatus(true, 'Connected to ' + API); return true; }
    setStatus(false, 'Server responded with an error');
    return false;
  }catch(e){
    setStatus(false, 'Cannot reach ' + API + ' — is your server running? (npm run dev)');
    return false;
  }
}

async function loadStudents(){
  list.innerHTML = '<div class="empty">Loading…</div>';
  try{
    const res = await fetch(API + '/students');
    if(!res.ok) throw new Error('Request failed (' + res.status + ')');
    const students = await res.json();
    renderList(students);
    setStatus(true, 'Connected to ' + API);
  }catch(e){
    list.innerHTML = '<div class="empty">Could not load students.<br>' + e.message + '</div>';
    setStatus(false, 'Cannot reach ' + API + ' — is your server running? (npm run dev)');
  }
}

function renderList(students){
  countBadge.textContent = students.length ? '(' + students.length + ')' : '';
  if(!students.length){
    list.innerHTML = '<div class="empty">No students yet. Add one on the left.</div>';
    return;
  }
  list.innerHTML = '';
  students.forEach(s => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `
      <div class="item-top">
        <div>
          <div class="item-name">${escapeHtml(s.name)}</div>
          <div class="item-meta">${escapeHtml(s.email)} · Age ${s.age}</div>
        </div>
        <div class="item-course">${escapeHtml(s.course)}</div>
      </div>
      <div class="item-id">ID: ${s._id}</div>
      <div class="item-actions">
        <button class="btn-warn" data-edit="${s._id}">Edit</button>
        <button class="btn-danger" data-delete="${s._id}">Delete</button>
      </div>
    `;
    list.appendChild(div);
  });

  list.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', () => startEdit(btn.dataset.edit, students));
  });
  list.querySelectorAll('[data-delete]').forEach(btn=>{
    btn.addEventListener('click', () => deleteStudent(btn.dataset.delete));
  });
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function startEdit(id, students){
  const s = students.find(x => x._id === id);
  if(!s) return;
  editingId = id;
  $('f-name').value = s.name;
  $('f-age').value = s.age;
  $('f-course').value = s.course;
  $('f-email').value = s.email;
  formTitle.textContent = 'Edit Student';
  submitBtn.textContent = 'Save Changes';
  cancelEditBtn.style.display = 'inline-block';
  window.scrollTo({top:0, behavior:'smooth'});
}

function resetForm(){
  editingId = null;
  form.reset();
  formTitle.textContent = 'Add Student';
  submitBtn.textContent = 'Create Student';
  cancelEditBtn.style.display = 'none';
}

async function deleteStudent(id){
  if(!confirm('Delete this student?')) return;
  try{
    const res = await fetch(API + '/students/' + id, { method:'DELETE' });
    const data = await res.json();
    if(!res.ok) throw new Error(data.message || 'Delete failed');
    loadStudents();
  }catch(e){
    alert('Error: ' + e.message);
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = {
    name: $('f-name').value.trim(),
    age: Number($('f-age').value),
    course: $('f-course').value.trim(),
    email: $('f-email').value.trim()
  };
  try{
    let res, data;
    if(editingId){
      res = await fetch(API + '/students/' + editingId, {
        method: 'PATCH',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
    } else {
      res = await fetch(API + '/students', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
    }
    data = await res.json();
    if(!res.ok) throw new Error(data.message || (data.error) || 'Request failed');
    showMsg(editingId ? 'Student updated ✔' : 'Student created ✔', true);
    resetForm();
    loadStudents();
  }catch(e){
    showMsg('Error: ' + e.message, false);
  }
});

cancelEditBtn.addEventListener('click', resetForm);
$('refreshBtn').addEventListener('click', loadStudents);
$('reconnectBtn').addEventListener('click', () => {
  API = $('baseUrl').value.replace(/\/$/,'');
  checkHealth().then(loadStudents);
});

checkHealth().then(loadStudents);
</script>
</body>
</html>
